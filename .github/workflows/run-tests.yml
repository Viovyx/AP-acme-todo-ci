name: Run tests
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions: read-all

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          # Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0.
          node-version: 24.x

      - name: Run tests
        run: npm run test
